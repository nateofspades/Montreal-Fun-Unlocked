name: Refresh events and deploy Pages

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '17 12,16,20 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Collect again even if today already has a successful fixed-EST refresh (use only to correct published data)'
        required: false
        type: boolean
        default: false
      deploy_only:
        description: 'Redeploy the existing validated dataset without contacting the source'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: montreal-fun-unlocked-refresh-and-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run test suite
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_app.js

      - name: Collect all 60-day pages
        if: ${{ !inputs.deploy_only }}
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh }}
        run: |
          force_arg=""
          if [ "$FORCE_REFRESH" = "true" ]; then force_arg="--force"; fi
          python scripts/collect.py --skip-if-success-today $force_arg --result-file collection-result.json

      - name: Validate data before commit and publication
        run: |
          set -o pipefail
          python scripts/validate.py docs/data | tee validation-report.json

      - name: Commit exactly one successful refresh update
        if: ${{ !inputs.deploy_only }}
        run: |
          refreshed=$(python -c "import json; print(str(json.load(open('collection-result.json'))['refreshed']).lower())")
          if [ "$refreshed" != "true" ]; then
            echo "A successful refresh already exists for this fixed-EST calendar day; no additional commit."
            exit 0
          fi
          refresh_date=$(python -c "import json; print(json.load(open('docs/data/metadata.json'))['collectionDateFixedEst'])")
          git config user.name "nateofspades"
          git config user.email "33226599+nateofspades@users.noreply.github.com"
          git add docs/data/events.json docs/data/events.csv docs/data/metadata.json
          git commit -m "chore(data): refresh events $refresh_date"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public deployed data
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_deployment.py --url "$PAGE_URL" --data-dir docs/data

      - name: Upload collection and validation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: refresh-diagnostics
          path: |
            collection-result.json
            validation-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload cached source responses on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failed-source-responses
          path: .cache/hasthings
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Explain a failed refresh or deployment
        if: ${{ failure() }}
        run: |
          echo '## Refresh or deployment failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Collection and validation must succeed before the data commit. A later deployment or public-verification failure can occur after validated data was committed and pushed; inspect the failed step and main before retrying.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public verification failure does not roll back Pages: public files may still be propagating or differ from the uploaded dataset. Successful datasets remain recoverable from Git.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect the seven-day diagnostics artifacts when available. Use deploy_only to republish existing validated data without recollecting; normal scheduled retries also skip collection after a same-fixed-EST-day success.' >> "$GITHUB_STEP_SUMMARY"
